[project]
name = "faq-rag"
version = "0.1.0"
description = "Naive RAG pipeline over the Dropbox Help Center"
readme = "README.md"
authors = [
    { name = "Mona Aghili" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "openai>=3.20.0",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
    "weaviate-client>=4.23.1",
]

[project.scripts]
faq-rag = "faq_rag.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
